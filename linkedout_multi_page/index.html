<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LinkedOut - Portal de Entrada</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="nav-container">
            <div class="brand-section">
                <a href="index.html" class="logo"><i class="fa-brands fa-linkedin"></i> LinkedOut</a>
            </div>
            <div style="font-size: 0.85rem; color: var(--text-secondary);">
                Plataforma de Oportunidades Acadêmicas
            </div>
        </div>
    </header>

    <main>
        <div class="portal-card">
            <h1><i class="fa-brands fa-linkedin"></i> LinkedOut</h1>
            <p>Selecione seu perfil e informe seu nome para acessar a plataforma do evento.</p>

            <form onsubmit="handlePortalLogin(event)">
                <div class="form-group">
                    <label>Seu Nome Completo</label>
                    <input type="text" id="user-name" class="form-control" placeholder="Ex: Ana Souza" required>
                </div>

                <div class="form-group">
                    <label>Tipo de Acesso</label>
                    <select id="user-role" class="form-control" required>
                        <option value="candidato">Candidato (Procurando Emprego / Técnico)</option>
                        <option value="recrutador">Recrutador / Avaliador de Vagas</option>
                    </select>
                </div>

                <button type="submit" class="btn-primary" style="margin-top: 1rem;">
                    Entrar no Portal <i class="fa-solid fa-arrow-right"></i>
                </button>
            </form>
        </div>
    </main>

    <script src="sync.js"></script>
    <script>
        function handlePortalLogin(e) {
            e.preventDefault();
            const name = document.getElementById('user-name').value.trim();
            const role = document.getElementById('user-role').value;

            if (!name) return;

            setCurrentUser({ name, role });

            if (role === 'candidato') {
                window.location.href = 'candidato.html';
            } else {
                window.location.href = 'recrutador.html';
            }
        }
    </script>
</body>
</html>
