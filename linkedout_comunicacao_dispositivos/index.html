<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LinkedOut - Portal de Entrada</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="nav-container">
            <div class="brand-section">
                <a href="index.html" class="logo"><i class="fa-brands fa-linkedin"></i> LinkedOut</a>
            </div>
            <div style="font-size: 0.85rem; color: var(--text-secondary);">
                Sincronização Inter-Dispositivos
            </div>
        </div>
    </header>

    <main>
        <div class="portal-card">
            <h1><i class="fa-brands fa-linkedin"></i> LinkedOut</h1>
            <p>Conecte o computador e os celulares da sala no mesmo Código de Sala para interagir ao vivo na apresentação.</p>

            <form onsubmit="handlePortalLogin(event)">
                <div class="form-group">
                    <label>Código da Sala de Apresentação</label>
                    <input type="text" id="room-code" class="form-control" placeholder="Ex: TURMA101" value="SALA-123" required style="font-weight: bold; text-transform: uppercase; color: var(--primary);">
                    <small style="color: #666; font-size: 0.75rem;">Digite o mesmo código no PC do Recrutador e nos celulares dos Candidatos.</small>
                </div>

                <div class="form-group">
                    <label>Seu Nome Completo</label>
                    <input type="text" id="user-name" class="form-control" placeholder="Ex: Gabriel Santos" required>
                </div>

                <div class="form-group">
                    <label>Tipo de Acesso neste Dispositivo</label>
                    <select id="user-role" class="form-control" required>
                        <option value="candidato">Candidato (Usar no Celular para se Candidatar)</option>
                        <option value="recrutador">Recrutador (Usar no PC para Avaliar Candidatos)</option>
                    </select>
                </div>

                <button type="submit" class="btn-primary" style="margin-top: 1rem;">
                    Entrar na Sala e Conectar <i class="fa-solid fa-signal"></i>
                </button>
            </form>
        </div>
    </main>

    <script src="network.js"></script>
    <script>
        function handlePortalLogin(e) {
            e.preventDefault();
            const room = document.getElementById('room-code').value.trim();
            const name = document.getElementById('user-name').value.trim();
            const role = document.getElementById('user-role').value;

            if (!name || !room) return;

            setRoomCode(room);
            setCurrentUser({ name, role });

            if (role === 'candidato') {
                window.location.href = 'candidato.html';
            } else {
                window.location.href = 'recrutador.html';
            }
        }
    </script>
</body>
</html>
